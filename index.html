<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artesania &amp; Calendario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marron: '#7B3F22',
            taupe: '#8B6B5E',
            arena: '#DDBFA4',
            caramelo: '#C68952',
            brand: {
              DEFAULT: '#7B3F22',
              hover: '#6A351C',
              pressed: '#5A2D17',
              light: '#A9623F',
              soft: '#F1E4D8',
            },
            neutral: {
              base: '#FAF7F2',
              alt: '#F4EDE5',
              surface: '#FFFFFF',
              sec: '#F7F2EC',
              border: '#E7DACB',
              textMain: '#312620',
              textSec: '#6E5A4E',
              textHelper: '#8B7666',
              customGray: '#7B6B60',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['"Playfair Display"', 'Georgia', 'serif'],
          },
        }
      }
    }
  </script>
  <style>
    :root {
      --vh: 100vh;
      --marron: #7B3F22;
      --taupe: #8B6B5E;
      --arena: #DDBFA4;
      --caramelo: #C68952;
      --paper: #FAF7F2;
      --line: #E7DACB;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: #FAF7F2;
      color: #312620;
      margin: 0;
      padding: 0;
      width: 100%;
      overflow: auto;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-weight: 400;
      line-height: 1.5;
      font-size: 15px;
    }

    /* Titulares editoriales (Playfair) en títulos de pantalla */
    h1,
    h2,
    h3 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }

    :focus-visible {
      outline: 2px solid #7B3F22;
      outline-offset: 2px;
      border-radius: 4px;
    }

    ::selection {
      background: #DDBFA4;
      color: #312620;
    }

    .soft-shadow {
      box-shadow: 0 1px 2px rgba(45, 30, 18, 0.04), 0 8px 24px -14px rgba(45, 30, 18, 0.14);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #E7DACB;
      border-radius: 10px;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .animate-fade-in {
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .premium-card {
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 1px 2px rgba(45, 30, 18, 0.04), 0 8px 24px -16px rgba(45, 30, 18, 0.12);
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
      border: 1px solid #E7DACB;
      padding: 20px;
    }

    @media (min-width: 768px) {
      .premium-card {
        padding: 28px;
      }
    }

    .activity-pill {
      background: #FFFFFF;
      border: 1px solid #E7DACB;
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      transition: all 0.3s ease;
      color: #312620;
    }

    .activity-pill:hover {
      border-color: #DDBFA4;
      background: #FFFDFB;
    }

    .day-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 88px;
      border-radius: 16px;
      transition: all 0.2s ease;
      cursor: pointer;
      background: #FFFFFF;
      border: 1px solid #E7DACB;
    }

    .day-pill:hover {
      border-color: #DDBFA4;
    }

    .day-pill-active {
      background-color: #7B3F22;
      color: white;
      border-color: #7B3F22;
    }

    .eyebrow {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #8B6B5E;
    }

    .title-huge {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(30px, 8vw, 48px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.02;
      color: #312620;
    }

    .accent-line {
      height: 3px;
      background-color: #C68952;
      width: 40px;
      border-radius: 99px;
    }
  </style>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
